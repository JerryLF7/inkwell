[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkwell"
version = "0.1.0"
description = "Python SDK for Zectrix e-ink cloud platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
inkwell = "inkwell.cli:main"

[tool.ruff]
line-length = 100
